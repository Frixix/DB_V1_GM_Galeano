<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 120" width="480" height="120" fill="none">
  <defs>
    <linearGradient id="logoBadgeBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" />
      <stop offset="100%" stop-color="#0f4c26" />
    </linearGradient>

    <linearGradient id="logoGoldFire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="logoMintFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <filter id="logoShadow" x="-10%" y="-10%" width="120%" height="120%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Isotipo Fénix en Origami -->
  <g transform="translate(14, 14)" filter="url(#logoShadow)">
    <rect width="92" height="92" rx="24" fill="url(#logoBadgeBg)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.3" />
    <rect x="2" y="2" width="88" height="44" rx="22" fill="#ffffff" fill-opacity="0.08" />

    <!-- Origami Fénix a escala dentro del badge -->
    <g transform="translate(-8, -8) scale(0.9)">
      <!-- Colas -->
      <polygon points="56,66 42,78 38,94 48,90 56,76" fill="#047857" opacity="0.9" />
      <polygon points="48,90 38,94 36,104 46,98" fill="url(#logoGoldFire)" />
      <polygon points="64,66 78,78 82,94 72,90 64,76" fill="#065f46" opacity="0.9" />
      <polygon points="72,90 82,94 84,104 74,98" fill="url(#logoGoldFire)" />
      <polygon points="60,62 54,74 60,88 60,62" fill="#059669" />
      <polygon points="60,62 66,74 60,88 60,62" fill="#10b981" />
      <polygon points="60,88 56,98 60,108 60,88" fill="url(#logoGoldFire)" />
      <polygon points="60,88 64,98 60,108 60,88" fill="#fde047" />

      <!-- Alas -->
      <polygon points="52,42 36,36 30,48 46,52" fill="#ffffff" fill-opacity="0.85" />
      <polygon points="46,52 30,48 24,56 40,60" fill="#a7f3d0" />
      <polygon points="40,60 24,56 18,62 34,65" fill="url(#logoMintFire)" />
      <polygon points="52,42 42,26 32,16 22,22 36,36" fill="#ffffff" fill-opacity="0.95" />
      <polygon points="32,16 22,22 14,20 24,12" fill="url(#logoGoldFire)" />
      <polygon points="42,26 52,42 60,34" fill="#ffffff" fill-opacity="0.75" />

      <polygon points="68,42 84,36 90,48 74,52" fill="#ffffff" fill-opacity="0.7" />
      <polygon points="74,52 90,48 96,56 80,60" fill="#6ee7b7" />
      <polygon points="80,60 96,56 102,62 86,65" fill="#047857" />
      <polygon points="68,42 78,26 88,16 98,22 84,36" fill="#ffffff" fill-opacity="0.9" />
      <polygon points="88,16 98,22 106,20 96,12" fill="url(#logoGoldFire)" />
      <polygon points="78,26 68,42 60,34" fill="#d1fae5" />

      <!-- Cuerpo & Cabeza -->
      <polygon points="60,34 52,44 60,56 60,34" fill="#ffffff" fill-opacity="0.95" />
      <polygon points="60,34 68,44 60,56 60,34" fill="#e2e8f0" />
      <polygon points="60,56 55,64 60,70 65,64" fill="url(#logoMintFire)" />
      <polygon points="60,26 56,34 60,36 60,26" fill="#ffffff" />
      <polygon points="60,26 64,34 60,36 60,26" fill="#e2e8f0" />
      <polygon points="60,18 55,26 60,28 60,18" fill="#ffffff" />
      <polygon points="60,18 65,26 60,28 60,18" fill="#cbd5e1" />
      <polygon points="60,12 56,19 60,21 64,19" fill="url(#logoGoldFire)" />
      <polygon points="60,7 58,13 60,14 62,13" fill="#fde047" />
    </g>
  </g>

  <!-- Tipografía EducoKrea -->
  <text x="124" y="66" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="40" font-weight="700" fill="#0f172a" letter-spacing="-1.2">
    Educo<tspan fill="#059669" font-weight="800">Krea</tspan>
  </text>
  <text x="126" y="88" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="11" font-weight="700" fill="#64748b" letter-spacing="2.8">
    PLATAFORMA EDUCATIVA
  </text>
</svg>