<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" fill="none">
  <defs>
    <!-- Gradiente de fondo del emblema -->
    <linearGradient id="phoenixBadge" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f4c26" stop-opacity="0.98" />
    </linearGradient>

    <!-- Gradientes de las facetas de fuego del fénix -->
    <linearGradient id="goldFire" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#fde047" />
    </linearGradient>

    <linearGradient id="mintFire" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>

    <!-- Sombra suave para que resalte -->
    <filter id="phoenixGlow" x="-20%" y="-20%" width="140%" height="140%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Contenedor / Escudo redondeado con borde cristal -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#phoenixBadge)" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.35" filter="url(#phoenixGlow)" />
  <rect x="8" y="8" width="104" height="52" rx="26" fill="#ffffff" fill-opacity="0.1" />

  <!-- ================= EL FÉNIX EN ORIGAMI ================= -->
  <g id="phoenixGroup" transform="translate(0, 2)">
    <!-- 1. PLUMAS DE LA COLA (LLAMAS GEOMÉTRICAS ASCENDENTES) -->
    <!-- Cola Izquierda -->
    <polygon points="56,66 42,78 38,94 48,90 56,76" fill="#047857" opacity="0.9" />
    <polygon points="48,90 38,94 36,104 46,98" fill="url(#goldFire)" />

    <!-- Cola Derecha -->
    <polygon points="64,66 78,78 82,94 72,90 64,76" fill="#065f46" opacity="0.9" />
    <polygon points="72,90 82,94 84,104 74,98" fill="url(#goldFire)" />

    <!-- Cola Central -->
    <polygon points="60,62 54,74 60,88 60,62" fill="#059669" />
    <polygon points="60,62 66,74 60,88 60,62" fill="#10b981" />
    <polygon points="60,88 56,98 60,108 60,88" fill="url(#goldFire)" />
    <polygon points="60,88 64,98 60,108 60,88" fill="#fde047" />

    <!-- 2. ALAS EN ORIGAMI (DESPLIEGUE GEOMÉTRICO MAJESTUOSO) -->
    <!-- Ala Izquierda: Facetas secundarias -->
    <polygon points="52,42 36,36 30,48 46,52" fill="#ffffff" fill-opacity="0.85" />
    <polygon points="46,52 30,48 24,56 40,60" fill="#a7f3d0" />
    <polygon points="40,60 24,56 18,62 34,65" fill="url(#mintFire)" />

    <!-- Ala Izquierda: Facetas primarias superiores (puntas altas) -->
    <polygon points="52,42 42,26 32,16 22,22 36,36" fill="#ffffff" fill-opacity="0.95" />
    <polygon points="32,16 22,22 14,20 24,12" fill="url(#goldFire)" />
    <polygon points="42,26 52,42 60,34" fill="#ffffff" fill-opacity="0.75" />

    <!-- Ala Derecha: Facetas secundarias -->
    <polygon points="68,42 84,36 90,48 74,52" fill="#ffffff" fill-opacity="0.7" />
    <polygon points="74,52 90,48 96,56 80,60" fill="#6ee7b7" />
    <polygon points="80,60 96,56 102,62 86,65" fill="#047857" />

    <!-- Ala Derecha: Facetas primarias superiores -->
    <polygon points="68,42 78,26 88,16 98,22 84,36" fill="#ffffff" fill-opacity="0.9" />
    <polygon points="88,16 98,22 106,20 96,12" fill="url(#goldFire)" />
    <polygon points="78,26 68,42 60,34" fill="#d1fae5" />

    <!-- 3. CUERPO Y PECHO (DIAMANTES FACETADOS) -->
    <!-- Pecho Izquierdo -->
    <polygon points="60,34 52,44 60,56 60,34" fill="#ffffff" fill-opacity="0.95" />
    <!-- Pecho Derecho -->
    <polygon points="60,34 68,44 60,56 60,34" fill="#e2e8f0" />
    <!-- Abdomen Inferior -->
    <polygon points="60,56 55,64 60,70 65,64" fill="url(#mintFire)" />

    <!-- 4. CABEZA Y CORONA/CRESTA DEL FÉNIX -->
    <!-- Cuello -->
    <polygon points="60,26 56,34 60,36 60,26" fill="#ffffff" />
    <polygon points="60,26 64,34 60,36 60,26" fill="#e2e8f0" />
    <!-- Cabeza y pico origami -->
    <polygon points="60,18 55,26 60,28 60,18" fill="#ffffff" />
    <polygon points="60,18 65,26 60,28 60,18" fill="#cbd5e1" />
    <!-- Cresta de fuego ascendente -->
    <polygon points="60,12 56,19 60,21 64,19" fill="url(#goldFire)" />
    <polygon points="60,7 58,13 60,14 62,13" fill="#fde047" />
  </g>
</svg>